[project]
name = "rxnorm-modules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.15.13",
    "databricks-connect==16.4.*",
    "click>=8.3.3",
    "pediatric-adr-shared",
]

[tool.uv.sources]
pediatric-adr-shared = { path = "../assets" }

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rxnorm_modules*"]

[project.scripts]
rxnorm = "rxnorm_modules.batch_update_drugs:main"
