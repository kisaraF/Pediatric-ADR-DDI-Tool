name: Ingestion Modules
on:
  workflow_dispatch:
jobs:
  extract-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          sparse-checkout: |  # only checkout this directory
            ingestion_modules/
            assets/
      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0 | latest 
      - name: Install Python
        run: uv python install 3.12.3
      - name: Install Dependencies
        run: uv sync
      - name: Fetch Latest URL
        run: python3 ingestion_modules/fetch_http_link.py

